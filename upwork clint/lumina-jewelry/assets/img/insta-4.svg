<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="Instagram post">
  <title>Instagram post</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff0f1"/>
      <stop offset="1" stop-color="#dfe2e4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- userSpaceOnUse so that straight strokes (zero-area bounding box)
         are still painted; objectBoundingBox would drop them entirely. -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="140" y1="120" x2="660" y2="680">
      <stop offset="0" stop-color="#e2caa0"/>
      <stop offset=".45" stop-color="#b8934a"/>
      <stop offset="1" stop-color="#8a6a2f"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#bg)"/>
  <rect width="700" height="700" fill="url(#glow)"/>
  <g transform="translate(35 35) scale(0.7875)" fill="none" stroke="url(#gold)" stroke-width="10.16" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="400" cy="404" rx="196" ry="138"/>
    <ellipse cx="400" cy="404" rx="170" ry="114" stroke-opacity=".38"/>
    <circle cx="596" cy="404" r="9" stroke-opacity=".8"/>
    <circle cx="539" cy="502" r="9" stroke-opacity=".8"/>
    <circle cx="261" cy="502" r="9" stroke-opacity=".8"/>
    <circle cx="204" cy="404" r="9" stroke-opacity=".8"/>
    <circle cx="261" cy="306" r="9" stroke-opacity=".8"/>
    <circle cx="539" cy="306" r="9" stroke-opacity=".8"/>
    <path d="M400 542 v22"/>
    <circle cx="400" cy="592" r="28"/>
  </g>
</svg>