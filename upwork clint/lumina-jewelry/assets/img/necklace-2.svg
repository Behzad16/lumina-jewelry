<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Gold pendant necklace on ivory backdrop">
  <title>Gold pendant necklace on ivory backdrop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2efe9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- userSpaceOnUse so that straight strokes (zero-area bounding box)
         are still painted; objectBoundingBox would drop them entirely. -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="140" y1="120" x2="660" y2="680">
      <stop offset="0" stop-color="#e2caa0"/>
      <stop offset=".45" stop-color="#b8934a"/>
      <stop offset="1" stop-color="#8a6a2f"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g transform="translate(40 40) scale(1.15)" fill="none" stroke="url(#gold)" stroke-width="6.96" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 214 Q400 568 604 214"/>
    <circle cx="196" cy="214" r="10"/>
    <circle cx="604" cy="214" r="10"/>
    <circle cx="298" cy="347" r="7" stroke-opacity=".7"/>
    <circle cx="502" cy="347" r="7" stroke-opacity=".7"/>
    <circle cx="400" cy="396" r="17"/>
    <path d="M400 414 C452 470 470 520 442 560 C420 592 380 592 358 560 C330 520 348 470 400 414 Z"/>
    <path d="M400 456 C426 492 434 520 419 540 C408 555 392 555 381 540 C366 520 374 492 400 456 Z" stroke-opacity=".4"/>
  </g>
</svg>