<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Eclat collection earrings">
  <title>Eclat collection earrings</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20201f"/>
      <stop offset="1" stop-color="#2e2822"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#d9bd7d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#d9bd7d" stop-opacity="0"/>
    </radialGradient>
    <!-- userSpaceOnUse so that straight strokes (zero-area bounding box)
         are still painted; objectBoundingBox would drop them entirely. -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="140" y1="120" x2="660" y2="680">
      <stop offset="0" stop-color="#e2caa0"/>
      <stop offset=".45" stop-color="#b8934a"/>
      <stop offset="1" stop-color="#8a6a2f"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>
  <g transform="translate(0 150) scale(1.125)" fill="none" stroke="url(#gold)" stroke-width="7.11" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="286" cy="272" r="30"/>
    <path d="M286 302 C338 372 344 436 286 520 C228 436 234 372 286 302 Z"/>
    <path d="M286 332 V490" stroke-opacity=".38"/>
    <circle cx="514" cy="272" r="30"/>
    <path d="M514 302 C566 372 572 436 514 520 C456 436 462 372 514 302 Z"/>
    <path d="M514 332 V490" stroke-opacity=".38"/>
  </g>
</svg>